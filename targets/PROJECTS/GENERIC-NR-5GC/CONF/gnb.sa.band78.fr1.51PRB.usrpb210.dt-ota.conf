// gnb.sa.band78.fr1.51PRB.usrpb210.dt-ota.conf
//
// dt_sync POWDER outdoor-OTA gNB config: USRP B210 + 51 PRB BWP centered
// at the GSCN-aligned SSB position 3440.64 MHz, fits inside the
// NICELabExp 3430-3450 MHz reservation.
//
// Same 51 PRB BWP math + GSCN 7805 SSB raster as the X310 indoor variant
// (gnb.sa.band78.fr1.51PRB.usrpx310.dt-ota.conf); only the RU section and
// the cross-node CN NETWORK_INTERFACES differ:
//
//   * RU: B210 USB (no sdr_addrs, no clock/time src override).
//   * Cross-node CN: in the dt-max-alloc / dt-outdoor-b210-mobile profiles
//     the AMF runs on a separate d430. Its NGAP SCTP must therefore be
//     reachable over the experiment ctrl-lan (192.168.1.0/24), NOT over
//     the CN host's local docker bridge (192.168.70.0/24 — only reachable
//     from inside the CN host). Use host networking on the AMF container
//     so it binds on 192.168.1.3 (cn d430 ctrl-lan IP).
//
//     gnb-real ctrl-lan IP:  192.168.1.1
//     cn       ctrl-lan IP:  192.168.1.3
//     twin     ctrl-lan IP:  192.168.1.4

Active_gNBs = ( "gNB-OAI");
Asn1_verbosity = "none";

gNBs =
(
 {
    gNB_ID    =  0xe00;
    gNB_name  =  "gNB-OAI";
    tracking_area_code  =  1;
    plmn_list = ({ mcc = 001; mnc = 01; mnc_length = 2; snssaiList = ({ sst = 1 }) });
    nr_cellid = 12345678L;

    pdsch_AntennaPorts_XP = 1;
    pusch_AntennaPorts    = 1;
    do_CSIRS              = 1;
    do_SRS                = 0;

    sib1_tda     = 15;
    min_rxtxtime = 6;

    servingCellConfigCommon = (
    {
      physCellId                                                      = 0;

      # 51 PRB BWP, band 78, 30 kHz SCS, SSB on GSCN 7805 (3440.64 MHz)
      absoluteFrequencySSB                                            = 629376;
      dl_frequencyBand                                                = 78;
      dl_absoluteFrequencyPointA                                      = 628764;
      dl_offstToCarrier                                               = 0;
      dl_subcarrierSpacing                                            = 1;
      dl_carrierBandwidth                                             = 51;

      initialDLBWPlocationAndBandwidth                                = 13750;
      initialDLBWPsubcarrierSpacing                                   = 1;
      initialDLBWPcontrolResourceSetZero                              = 11;
      initialDLBWPsearchSpaceZero                                     = 0;

      ul_frequencyBand                                                = 78;
      ul_offstToCarrier                                               = 0;
      ul_subcarrierSpacing                                            = 1;
      ul_carrierBandwidth                                             = 51;
      pMax                                                            = 20;

      initialULBWPlocationAndBandwidth                                = 13750;
      initialULBWPsubcarrierSpacing                                   = 1;

      prach_ConfigurationIndex                                        = 100;
      prach_msg1_FDM                                                  = 0;
      prach_msg1_FrequencyStart                                       = 0;
      zeroCorrelationZoneConfig                                       = 15;
      preambleReceivedTargetPower                                     = -104;
      preambleTransMax                                                = 6;
      powerRampingStep                                                = 1;
      ra_ResponseWindow                                               = 4;
      ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR                    = 3;
      ssb_perRACH_OccasionAndCB_PreamblesPerSSB                       = 15;
      ra_ContentionResolutionTimer                                    = 7;
      rsrp_ThresholdSSB                                               = 19;
      prach_RootSequenceIndex_PR                                      = 2;
      prach_RootSequenceIndex                                         = 1;
      msg1_SubcarrierSpacing                                          = 1,
      restrictedSetConfig                                             = 0,
      msg3_DeltaPreamble                                              = 1;
      p0_NominalWithGrant                                             = -96;

      pucchGroupHopping                                               = 0;
      hoppingId                                                       = 40;
      p0_nominal                                                      = -96;

      ssb_PositionsInBurst_Bitmap                                     = 1;
      ssb_periodicityServingCell                                      = 2;
      dmrs_TypeA_Position                                             = 0;
      subcarrierSpacing                                               = 1;

      referenceSubcarrierSpacing                                      = 1;
      dl_UL_TransmissionPeriodicity                                   = 6;
      nrofDownlinkSlots                                               = 7;
      nrofDownlinkSymbols                                             = 6;
      nrofUplinkSlots                                                 = 2;
      nrofUplinkSymbols                                               = 4;

      ssPBCH_BlockPower                                               = -25;
    }
    );

    SCTP :
    {
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };

    # Cross-node CN: AMF on cn d430, reach over ctrl-lan.
    amf_ip_address = ({ ipv4 = "192.168.1.3"; });

    NETWORK_INTERFACES :
    {
        # gnb-real ctrl-lan IP (POWDER assigns 192.168.1.1 per profile_max_alloc.py).
        GNB_IPV4_ADDRESS_FOR_NG_AMF  = "192.168.1.1/24";
        GNB_IPV4_ADDRESS_FOR_NGU     = "192.168.1.1/24";
        GNB_PORT_FOR_S1U             = 2152;
    };
  }
);

MACRLCs = (
{
  num_cc                      = 1;
  tr_s_preference             = "local_L1";
  tr_n_preference             = "local_RRC";
  pusch_TargetSNRx10          = 150;
  pucch_TargetSNRx10          = 200;
}
);

L1s = (
{
  num_cc                = 1;
  tr_n_preference       = "local_mac";
  pusch_proc_threads    = 8;
  prach_dtx_threshold   = 120;
  pucch0_dtx_threshold  = 150;
  ofdm_offset_divisor   = 8;
}
);

RUs = (
{
  # USRP B210 over USB3. No sdr_addrs (B210 is the only USRP on the host
  # USB bus; UHD auto-selects via `type=b200`). Gains taken from the
  # 51PRB X310 dt-ota.conf -- adjust at runtime if RSRP off-target.
  local_rf       = "yes";
  nb_tx          = 1;
  nb_rx          = 1;
  att_tx         = 12;
  att_rx         = 12;
  bands          = [78];
  max_pdschReferenceSignalPower = -27;
  max_rxgain                    = 70;
  sf_extension                  = 0;
  eNB_instances  = [0];
  clock_src      = "internal";
  time_src       = "internal";
}
);

rfsimulator :
{
  serveraddr = "server";
  serverport = 4043;
  options = ();
  modelname = "AWGN";
  IQfile = "/tmp/rfsimulator.iqs";
};

security = {
  ciphering_algorithms  = ( "nea0" );
  integrity_algorithms  = ( "nia2", "nia0" );
  drb_ciphering         = "yes";
  drb_integrity         = "no";
};

log_config :
{
  global_log_level    = "info";
  global_log_verbosity= "medium";
  hw_log_level        = "info";
  hw_log_verbosity    = "medium";
  phy_log_level       = "info";
  phy_log_verbosity   = "medium";
  mac_log_level       = "info";
  mac_log_verbosity   = "high";
  rlc_log_level       = "info";
  rlc_log_verbosity   = "medium";
  pdcp_log_level      = "info";
  pdcp_log_verbosity  = "medium";
  rrc_log_level       = "info";
  rrc_log_verbosity   = "medium";
  ngap_log_level      = "debug";
  ngap_log_verbosity  = "medium";
};
