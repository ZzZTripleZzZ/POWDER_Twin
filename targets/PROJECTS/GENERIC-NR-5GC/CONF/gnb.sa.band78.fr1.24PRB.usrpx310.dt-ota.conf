// gnb.sa.band78.fr1.24PRB.usrpx310.dt-ota.conf
//
// dt_sync POWDER indoor-OTA gNB config: USRP X310 + 24 PRB BWP centered at
// 3439.92 MHz, fits inside the NICELabExp 3430-3450 MHz reservation.
//
// Frequency math (band 78, 30 kHz SCS, ARFCN step 15 kHz):
//   absoluteFrequencySSB    = 629328  ->  3439.92 MHz   (carrier center)
//   absoluteFrequencyPointA = 629040  ->  3435.60 MHz   (lowest subcarrier)
//   24 PRB x 12 SC x 30 kHz = 8.64 MHz BWP -> [3435.60, 3444.24] MHz
//   SSB offset above pointA = 12 PRB = 4.32 MHz -> SSB centered at 3439.92.
//
// Both ARFCNs are multiples of 24 (GSCN raster compatible for band 78).
//
// USRP: X310 over 1 GigE/10 GigE Ethernet. sdr_addrs is a placeholder; the
// real_twin_eval.py orchestrator probes ota-x310-{2,3,4} via uhd_find_devices
// and sed-patches the live X310 ctrl-lan IP into this file before bringing
// the gNB container up.

Active_gNBs = ( "gNB-OAI");
Asn1_verbosity = "none";

gNBs =
(
 {
    gNB_ID    =  0xe00;
    gNB_name  =  "gNB-OAI";
    tracking_area_code  =  1;
    plmn_list = ({ mcc = 001; mnc = 01; mnc_length = 2; snssaiList = ({ sst = 1 }) });
    nr_cellid = 12345678L;

    sib1_tda     = 15;
    min_rxtxtime = 6;

    servingCellConfigCommon = (
    {
      physCellId                                                      = 0;

      # downlinkConfigCommon — 24 PRB BWP, band 78, 30 kHz SCS
      absoluteFrequencySSB                                            = 629328;  # 3439.92 MHz
      dl_frequencyBand                                                = 78;
      dl_absoluteFrequencyPointA                                      = 629040;  # 3435.60 MHz
      dl_offstToCarrier                                               = 0;
      dl_subcarrierSpacing                                            = 1;       # 30 kHz
      dl_carrierBandwidth                                             = 24;

      initialDLBWPlocationAndBandwidth                                = 6325;
      initialDLBWPsubcarrierSpacing                                   = 1;
      initialDLBWPcontrolResourceSetZero                              = 2;
      initialDLBWPsearchSpaceZero                                     = 0;

      # uplinkConfigCommon
      ul_frequencyBand                                                = 78;
      ul_offstToCarrier                                               = 0;
      ul_subcarrierSpacing                                            = 1;
      ul_carrierBandwidth                                             = 24;
      pMax                                                            = 20;

      initialULBWPlocationAndBandwidth                                = 6325;
      initialULBWPsubcarrierSpacing                                   = 1;

      prach_ConfigurationIndex                                        = 98;
      prach_msg1_FDM                                                  = 0;
      prach_msg1_FrequencyStart                                       = 0;
      zeroCorrelationZoneConfig                                       = 13;
      preambleReceivedTargetPower                                     = -96;
      preambleTransMax                                                = 6;
      powerRampingStep                                                = 1;
      ra_ResponseWindow                                               = 4;
      ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR                    = 4;
      ssb_perRACH_OccasionAndCB_PreamblesPerSSB                       = 14;
      ra_ContentionResolutionTimer                                    = 7;
      rsrp_ThresholdSSB                                               = 19;
      prach_RootSequenceIndex_PR                                      = 2;
      prach_RootSequenceIndex                                         = 1;
      msg1_SubcarrierSpacing                                          = 1,
      restrictedSetConfig                                             = 0,
      msg3_DeltaPreamble                                              = 1;
      p0_NominalWithGrant                                             =-90;

      pucchGroupHopping                                               = 0;
      hoppingId                                                       = 40;
      p0_nominal                                                      = -90;

      ssb_PositionsInBurst_Bitmap                                     = 1;
      ssb_periodicityServingCell                                      = 2;
      dmrs_TypeA_Position                                             = 0;
      subcarrierSpacing                                               = 1;

      referenceSubcarrierSpacing                                      = 1;
      dl_UL_TransmissionPeriodicity                                   = 6;
      nrofDownlinkSlots                                               = 7;
      nrofDownlinkSymbols                                             = 6;
      nrofUplinkSlots                                                 = 2;
      nrofUplinkSymbols                                               = 4;

      ssPBCH_BlockPower                                               = -25;
    }
    );

    SCTP :
    {
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };

    amf_ip_address = ({ ipv4 = "192.168.70.132"; });

    NETWORK_INTERFACES :
    {
        # Bridge default IP for tt-public-net (192.168.70.128/26) — already on
        # the host when network_mode: host. No 'ip addr add' workaround needed.
        GNB_IPV4_ADDRESS_FOR_NG_AMF  = "192.168.70.129/24";
        GNB_IPV4_ADDRESS_FOR_NGU     = "192.168.70.129/24";
        GNB_PORT_FOR_S1U             = 2152;
    };
  }
);

MACRLCs = (
{
  num_cc                      = 1;
  tr_s_preference             = "local_L1";
  tr_n_preference             = "local_RRC";
  pusch_TargetSNRx10          = 150;
  pucch_TargetSNRx10          = 200;
}
);

L1s = (
{
  num_cc                = 1;
  tr_n_preference       = "local_mac";
  pusch_proc_threads    = 8;
  prach_dtx_threshold   = 120;
  pucch0_dtx_threshold  = 150;
  ofdm_offset_divisor   = 8;
}
);

RUs = (
{
  # USRP X310 over Ethernet. sdr_addrs is sed-patched at runtime by
  # real_twin_eval.py:start_real_gnb() to the live ota-x310-* ctrl-lan IP.
  local_rf       = "yes";
  nb_tx          = 1;
  nb_rx          = 1;
  att_tx         = 12;
  att_rx         = 12;
  bands          = [78];
  max_pdschReferenceSignalPower = -27;
  max_rxgain                    = 75;
  sf_extension                  = 0;
  eNB_instances  = [0];
  sdr_addrs      = "addr=192.168.1.12";   # placeholder — orchestrator overwrites
  clock_src      = "internal";
  time_src       = "internal";
}
);

rfsimulator :
{
  serveraddr = "server";
  serverport = 4043;
  options = ();
  modelname = "AWGN";
  IQfile = "/tmp/rfsimulator.iqs";
};

security = {
  ciphering_algorithms  = ( "nea0" );
  integrity_algorithms  = ( "nia2", "nia0" );
  drb_ciphering         = "yes";
  drb_integrity         = "no";
};

log_config :
{
  global_log_level    = "info";
  global_log_verbosity= "medium";
  hw_log_level        = "info";
  hw_log_verbosity    = "medium";
  phy_log_level       = "info";
  phy_log_verbosity   = "medium";
  mac_log_level       = "info";
  mac_log_verbosity   = "high";
  rlc_log_level       = "info";
  rlc_log_verbosity   = "medium";
  pdcp_log_level      = "info";
  pdcp_log_verbosity  = "medium";
  rrc_log_level       = "info";
  rrc_log_verbosity   = "medium";
  ngap_log_level      = "debug";
  ngap_log_verbosity  = "medium";
};
