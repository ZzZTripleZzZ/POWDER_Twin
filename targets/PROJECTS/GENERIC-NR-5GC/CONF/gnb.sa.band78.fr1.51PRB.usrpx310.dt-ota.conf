// gnb.sa.band78.fr1.51PRB.usrpx310.dt-ota.conf
//
// dt_sync POWDER indoor-OTA gNB config: USRP X310 + 51 PRB BWP centered at
// the GSCN-aligned SSB position 3440.64 MHz, fits inside the NICELabExp
// 3430-3450 MHz reservation.
//
// Why 51 PRB (not 24): a 24 PRB BWP cannot host a 20 RB SSB on the GSCN
// raster, so COTS UEs (Quectel RM500Q-GL) cannot find the cell. 51 PRB at
// 30 kHz SCS = 18.36 MHz, which is the smallest BWP that:
//   * fits 3430-3450 MHz (3431.46 to 3449.82),
//   * lets the SSB land on a valid GSCN raster point (GSCN 7805 = 3440.64),
//   * leaves room for CORESET#0 (24 RB at index 11).
//
// Frequency math (band 78, 30 kHz SCS, ARFCN step 15 kHz, GSCN N*1.44 MHz):
//   absoluteFrequencySSB    = 629376  ->  3440.64 MHz   (GSCN 7805)
//   dl_absoluteFrequencyPointA = 628764  ->  3431.46 MHz (lowest subcarrier)
//   SSB offset above PointA    = 612 ARFCN = 9.18 MHz = 25.5 PRB
//                                (SSB centered at PRB 25.5; SSB 20 RB
//                                 occupies PRB 15.5..35.5 -> fully inside
//                                 51 PRB BWP).
//   51 PRB x 12 SC x 30 kHz    = 18.36 MHz BWP -> [3431.46, 3449.82] MHz.
//
// USRP: X310 over 1 GigE/10 GigE Ethernet via the dedicated radio-link
// (192.168.40.0/24). The orchestrator (real_twin_eval.py) probes the X310
// via uhd_find_devices and sed-patches the live address into sdr_addrs
// before the gNB container starts.

Active_gNBs = ( "gNB-OAI");
Asn1_verbosity = "none";

gNBs =
(
 {
    gNB_ID    =  0xe00;
    gNB_name  =  "gNB-OAI";
    tracking_area_code  =  1;
    plmn_list = ({ mcc = 001; mnc = 01; mnc_length = 2; snssaiList = ({ sst = 1 }) });
    nr_cellid = 12345678L;

    pdsch_AntennaPorts_XP = 1;
    pusch_AntennaPorts    = 1;
    do_CSIRS              = 1;
    do_SRS                = 0;

    sib1_tda     = 15;
    min_rxtxtime = 6;

    servingCellConfigCommon = (
    {
      physCellId                                                      = 0;

      # downlinkConfigCommon - 51 PRB BWP, band 78, 30 kHz SCS,
      # SSB on GSCN 7805 (3440.64 MHz)
      absoluteFrequencySSB                                            = 629376;
      dl_frequencyBand                                                = 78;
      dl_absoluteFrequencyPointA                                      = 628764;
      dl_offstToCarrier                                               = 0;
      dl_subcarrierSpacing                                            = 1;       # 30 kHz
      dl_carrierBandwidth                                             = 51;

      # 51 PRB BWP starting at PointA: RIV = 275*(L-1)+RBstart = 275*50 + 0 = 13750
      initialDLBWPlocationAndBandwidth                                = 13750;
      initialDLBWPsubcarrierSpacing                                   = 1;
      # CORESET#0 index 11: 24 RB CORESET at RB offset 14 from SSB lower edge,
      # 1 symbol. Compatible with 51 PRB BWP and SSB at PRB 15.5.
      initialDLBWPcontrolResourceSetZero                              = 11;
      initialDLBWPsearchSpaceZero                                     = 0;

      # uplinkConfigCommon
      ul_frequencyBand                                                = 78;
      ul_offstToCarrier                                               = 0;
      ul_subcarrierSpacing                                            = 1;
      ul_carrierBandwidth                                             = 51;
      pMax                                                            = 20;

      initialULBWPlocationAndBandwidth                                = 13750;
      initialULBWPsubcarrierSpacing                                   = 1;

      # PRACH config 100 = format A2 FR1 TDD, period 2 frames, occasion in
      # subframe 9 (compatible with the TDD pattern below).
      prach_ConfigurationIndex                                        = 100;
      prach_msg1_FDM                                                  = 0;
      prach_msg1_FrequencyStart                                       = 0;
      zeroCorrelationZoneConfig                                       = 15;
      preambleReceivedTargetPower                                     = -104;
      preambleTransMax                                                = 6;
      powerRampingStep                                                = 1;
      ra_ResponseWindow                                               = 4;
      ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR                    = 3;
      ssb_perRACH_OccasionAndCB_PreamblesPerSSB                       = 15;
      ra_ContentionResolutionTimer                                    = 7;
      rsrp_ThresholdSSB                                               = 19;
      prach_RootSequenceIndex_PR                                      = 2;
      prach_RootSequenceIndex                                         = 1;
      msg1_SubcarrierSpacing                                          = 1,
      restrictedSetConfig                                             = 0,
      msg3_DeltaPreamble                                              = 1;
      p0_NominalWithGrant                                             = -96;

      pucchGroupHopping                                               = 0;
      hoppingId                                                       = 40;
      p0_nominal                                                      = -96;

      ssb_PositionsInBurst_Bitmap                                     = 1;
      ssb_periodicityServingCell                                      = 2;
      dmrs_TypeA_Position                                             = 0;
      subcarrierSpacing                                               = 1;

      referenceSubcarrierSpacing                                      = 1;
      # period 5 ms (=2.5 ms repetition), 7DL slots + 6DL syms / 2UL slots + 4UL syms.
      dl_UL_TransmissionPeriodicity                                   = 6;
      nrofDownlinkSlots                                               = 7;
      nrofDownlinkSymbols                                             = 6;
      nrofUplinkSlots                                                 = 2;
      nrofUplinkSymbols                                               = 4;

      ssPBCH_BlockPower                                               = -25;
    }
    );

    SCTP :
    {
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };

    amf_ip_address = ({ ipv4 = "192.168.70.132"; });

    NETWORK_INTERFACES :
    {
        # The bridge gateway IP for tt-public-net (192.168.70.128/26) - already
        # on the host when network_mode: host. EdgeRIC ZMQ publisher (hardcoded
        # in executables/edgeric/edgeric.cpp) binds 192.168.70.140 separately;
        # real_twin_eval.py adds .140 as a host alias so the bind succeeds.
        GNB_IPV4_ADDRESS_FOR_NG_AMF  = "192.168.70.129/24";
        GNB_IPV4_ADDRESS_FOR_NGU     = "192.168.70.129/24";
        GNB_PORT_FOR_S1U             = 2152;
    };
  }
);

MACRLCs = (
{
  num_cc                      = 1;
  tr_s_preference             = "local_L1";
  tr_n_preference             = "local_RRC";
  pusch_TargetSNRx10          = 150;
  pucch_TargetSNRx10          = 200;
}
);

L1s = (
{
  num_cc                = 1;
  tr_n_preference       = "local_mac";
  pusch_proc_threads    = 8;
  prach_dtx_threshold   = 120;
  pucch0_dtx_threshold  = 150;
  ofdm_offset_divisor   = 8;
}
);

RUs = (
{
  # USRP X310 over Ethernet. sdr_addrs is sed-patched at runtime by
  # real_twin_eval.py:start_real_gnb() to the live X310 IP on the dedicated
  # radio-link (typically 192.168.40.2 per the POWDER profile).
  local_rf       = "yes";
  nb_tx          = 1;
  nb_rx          = 1;
  att_tx         = 12;
  att_rx         = 12;
  bands          = [78];
  max_pdschReferenceSignalPower = -27;
  max_rxgain                    = 114;
  sf_extension                  = 0;
  eNB_instances  = [0];
  sdr_addrs      = "addr=192.168.40.2";   # placeholder - orchestrator overwrites
  clock_src      = "internal";
  time_src       = "internal";
}
);

rfsimulator :
{
  serveraddr = "server";
  serverport = 4043;
  options = ();
  modelname = "AWGN";
  IQfile = "/tmp/rfsimulator.iqs";
};

security = {
  ciphering_algorithms  = ( "nea0" );
  integrity_algorithms  = ( "nia2", "nia0" );
  drb_ciphering         = "yes";
  drb_integrity         = "no";
};

log_config :
{
  global_log_level    = "info";
  global_log_verbosity= "medium";
  hw_log_level        = "info";
  hw_log_verbosity    = "medium";
  phy_log_level       = "info";
  phy_log_verbosity   = "medium";
  mac_log_level       = "info";
  mac_log_verbosity   = "high";
  rlc_log_level       = "info";
  rlc_log_verbosity   = "medium";
  pdcp_log_level      = "info";
  pdcp_log_verbosity  = "medium";
  rrc_log_level       = "info";
  rrc_log_verbosity   = "medium";
  ngap_log_level      = "debug";
  ngap_log_verbosity  = "medium";
};
