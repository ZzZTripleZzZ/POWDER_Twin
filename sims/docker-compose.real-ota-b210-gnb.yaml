# docker-compose.real-ota-b210-gnb.yaml
#
# Outdoor OTA gNB on cnode-guesthouse with B210 (USB3). Host-network so
# NGAP SCTP and GTP-U bind on the ctrl-lan IP (192.168.1.1, set in the
# mounted gnb conf) and reach the AMF on cn d430 (192.168.1.3).
#
# Pair with docker-compose.5gcn.yaml on the cn d430 (the AMF runs on
# network_mode: host there too).

services:
  tt-gnb:
    container_name: tt-gnb
    image: tt-gnb:v2
    network_mode: host
    privileged: true
    volumes:
      - ../targets/PROJECTS/GENERIC-NR-5GC/CONF/gnb.sa.band78.fr1.51PRB.usrpb210.dt-ota.conf:/tt-ran/targets/PROJECTS/GENERIC-NR-5GC/CONF/gnb.sa.band78.fr1.51PRB.usrpb210.dt-ota.conf:ro
    devices:
      # USB pass-through for the B210. The cnode hosts only one USRP so
      # exposing the entire /dev/bus/usb keeps udev rules + UHD probing
      # straightforward.
      - /dev/bus/usb:/dev/bus/usb
    environment:
      - TZ=America/Denver
    entrypoint: ["/tini", "--"]
    command:
      - /tt-ran/cmake_targets/ran_build/build/nr-softmodem
      - -O
      - /tt-ran/targets/PROJECTS/GENERIC-NR-5GC/CONF/gnb.sa.band78.fr1.51PRB.usrpb210.dt-ota.conf
      - --sa
      - --usrp-args
      - type=b200
    restart: "no"
