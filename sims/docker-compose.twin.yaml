# dt_sync Twin Docker Compose
# Supports three modes via TT_CHANNEL_FILE_REAL / TT_CHANNEL_FILE_IMAG env vars:
#
#   Phase B  (static, default):
#     cd ~/Tiny_Twin/sims
#     sudo docker compose -f docker-compose.twin.yaml up -d tt-gnb
#     sleep 5
#     sudo docker compose -f docker-compose.twin.yaml up -d tt-nrue1
#
#   Phase B2 (dynamic CIR file):
#     export TT_CHANNEL_FILE_REAL=/tt-ran/channel/channel_gradual.txt
#     export TT_CHANNEL_FILE_IMAG=/tt-ran/channel/channel_gradual.txt
#     sudo -E docker compose -f docker-compose.twin.yaml up -d tt-gnb; sleep 5; ...
#
#   Phase C2 (named pipe — real-time sync from state_sync.py):
#     mkfifo /tmp/tt_cir_real.fifo /tmp/tt_cir_imag.fifo
#     export TT_CHANNEL_FILE_REAL=/tmp/tt_cir_real.fifo
#     export TT_CHANNEL_FILE_IMAG=/tmp/tt_cir_imag.fifo
#     sudo -E docker compose -f docker-compose.twin.yaml up -d tt-gnb tt-nrue1
#
# Prerequisite: docker network tt-public-net exists (created by profile_twin.py startup).
# Start CN first: cd ~/Tiny_Twin/sims/oai-cn
#   sudo docker compose -f docker-compose.yaml -f oai-cn-tt-override.yaml up -d
#
# NOTE: binaries run from inside the container image (no host-compiled OAI needed).
#   gNB binary: /tt-ran/cmake_targets/ran_build/build/nr-softmodem   (tt-gnb:v2)
#   UE  binary: /opt/tt-ran/cmake_targets/ran_build/build/nr-uesoftmodem  (tt-nrue:v2)

services:
  # ── gNB (Twin) ──────────────────────────────────────────────────────────────
  tt-gnb:
    image: tt-gnb:v2
    container_name: tt-gnb
    privileged: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      # CIR file paths — override at runtime for B2 (file) or C2 (named pipe)
      - TT_CHANNEL_FILE_REAL=${TT_CHANNEL_FILE_REAL:-/tt-ran/channel/channel_clean.txt}
      - TT_CHANNEL_FILE_IMAG=${TT_CHANNEL_FILE_IMAG:-/tt-ran/channel/channel_clean.txt}
    volumes:
      - ../logs:/tt-ran/logs        # expose gNB logs to host
      - /tmp:/tmp:rw                # named pipe support for Phase C2
    entrypoint:
      - /bin/bash
      - -c
      - >-
        mkdir -p /tt-ran/logs &&
        cd /tt-ran/cmake_targets/ran_build/build/ &&
        exec ./nr-softmodem
        -O ../../../targets/PROJECTS/GENERIC-NR-5GC/CONF/gnb.sa.band78.fr1.106PRB.usrpb210.conf
        --rfsim -E --sa
        --rfsimulator.options chanmod
        --TAP 1 --TTI 1 --SNR 1 --CQI 1 --TPT 1
    stdin_open: true
    tty: true
    networks:
      public_net:
        ipv4_address: 192.168.70.140

  # ── UE 1 ────────────────────────────────────────────────────────────────────
  tt-nrue1:
    image: tt-nrue:v2
    container_name: tt-ue1
    privileged: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    entrypoint:
      - /bin/bash
      - -c
      - >-
        cd /opt/tt-ran/cmake_targets/ran_build/build/ &&
        exec ./nr-uesoftmodem
        --uicc0.imsi 001010000000001
        -C 3619200000 -r 106 --numerology 1 --ssb 516
        -E --sa --rfsim
        --rfsimulator.options chanmod
        --TAP 1
        -O ../../../ci-scripts/conf_files/nrue.uicc.conf
        --rfsimulator.serveraddr 192.168.70.140
    stdin_open: true
    tty: true
    depends_on:
      - tt-gnb
    networks:
      public_net:
        ipv4_address: 192.168.70.150
    devices:
      - /dev/net/tun:/dev/net/tun

  # ── UE 2 ────────────────────────────────────────────────────────────────────
  tt-nrue2:
    image: tt-nrue:v2
    container_name: tt-ue2
    privileged: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    entrypoint:
      - /bin/bash
      - -c
      - >-
        cd /opt/tt-ran/cmake_targets/ran_build/build/ &&
        exec ./nr-uesoftmodem
        --uicc0.imsi 001010000000002
        -C 3619200000 -r 106 --numerology 1 --ssb 516
        -E --sa --rfsim
        --rfsimulator.options chanmod
        --TAP 1
        -O ../../../ci-scripts/conf_files/nrue.uicc.conf
        --rfsimulator.serveraddr 192.168.70.140
    stdin_open: true
    tty: true
    depends_on:
      - tt-gnb
    networks:
      public_net:
        ipv4_address: 192.168.70.151
    devices:
      - /dev/net/tun:/dev/net/tun

  # ── UE 3 ────────────────────────────────────────────────────────────────────
  tt-nrue3:
    image: tt-nrue:v2
    container_name: tt-ue3
    privileged: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    entrypoint:
      - /bin/bash
      - -c
      - >-
        cd /opt/tt-ran/cmake_targets/ran_build/build/ &&
        exec ./nr-uesoftmodem
        --uicc0.imsi 001010000000003
        -C 3619200000 -r 106 --numerology 1 --ssb 516
        -E --sa --rfsim
        --rfsimulator.options chanmod
        --TAP 1
        -O ../../../ci-scripts/conf_files/nrue.uicc.conf
        --rfsimulator.serveraddr 192.168.70.140
    stdin_open: true
    tty: true
    depends_on:
      - tt-gnb
    networks:
      public_net:
        ipv4_address: 192.168.70.153
    devices:
      - /dev/net/tun:/dev/net/tun

networks:
  public_net:
    external: true
    name: tt-public-net
