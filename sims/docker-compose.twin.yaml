# dt_sync Twin Docker Compose
# Supports three modes via TT_CHANNEL_FILE_REAL / TT_CHANNEL_FILE_IMAG env vars:
#
#   Phase B  (static, default):
#     docker compose -f docker-compose.twin.yaml up -d tt-gnb tt-nrue1
#
#   Phase B2 (dynamic CIR file):
#     TT_CHANNEL_FILE_REAL=../Tiny_Twin/channel/channel_gradual.txt \
#     TT_CHANNEL_FILE_IMAG=../Tiny_Twin/channel/channel_gradual.txt \
#     docker compose -f docker-compose.twin.yaml up -d tt-gnb tt-nrue1
#
#   Phase C2 (named pipe — real-time sync from state_sync.py):
#     mkfifo /tmp/tt_cir_real.fifo /tmp/tt_cir_imag.fifo
#     TT_CHANNEL_FILE_REAL=/tmp/tt_cir_real.fifo \
#     TT_CHANNEL_FILE_IMAG=/tmp/tt_cir_imag.fifo \
#     docker compose -f docker-compose.twin.yaml up -d tt-gnb tt-nrue1
#
# Prerequisite: docker network create --driver bridge \
#   --subnet 192.168.70.128/26 tt-public-net

services:
  # NOTE: oai-cn is NOT managed here — start it separately before this compose:
  #   cd ~/Tiny_Twin/sims/oai-cn && docker compose up -d
  #   (wait until mysql, oai-amf, oai-smf, oai-upf, oai-ext-dn are healthy)

  # ── gNB (Twin) ──────────────────────────────────────────────────────────────
  tt-gnb:
    image: tt-gnb:v2
    container_name: tt-gnb
    privileged: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      # CIR file paths — override at runtime for B2 (file) or C2 (named pipe)
      - TT_CHANNEL_FILE_REAL=${TT_CHANNEL_FILE_REAL:-/opt/tt-ran/tt/channel/channel_clean.txt}
      - TT_CHANNEL_FILE_IMAG=${TT_CHANNEL_FILE_IMAG:-/opt/tt-ran/tt/channel/channel_clean.txt}
    volumes:
      - ../Tiny_Twin:/opt/tt-ran/tt:rw
      # Named pipe support: mount /tmp from host so pipes are accessible
      - /tmp:/tmp:rw
    entrypoint: >
      /bin/bash -c "
        cd /opt/tt-ran/tt/cmake_targets/ran_build/build/ &&
        TT_CHANNEL_FILE_REAL=$TT_CHANNEL_FILE_REAL \
        TT_CHANNEL_FILE_IMAG=$TT_CHANNEL_FILE_IMAG \
        ./nr-softmodem \
          -O ../../../targets/PROJECTS/GENERIC-NR-5GC/CONF/gnb.sa.band78.fr1.106PRB.usrpb210.conf \
          --rfsim -E --sa \
          --rfsimulator.options chanmod \
          --TAP 1 --TTI 1 --SNR 1 &&
        exec /bin/bash"
    stdin_open: true
    tty: true
    networks:
      public_net:
        ipv4_address: 192.168.70.140

  # ── UE 1 ────────────────────────────────────────────────────────────────────
  tt-nrue1:
    image: tt-nrue:v2
    container_name: tt-ue1
    privileged: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ../Tiny_Twin:/opt/tt-ran/tt:rw
    entrypoint: >
      /bin/bash -c "
        cd /opt/tt-ran/tt/cmake_targets/ran_build/build/ &&
        ./nr-uesoftmodem \
          --uicc0.imsi 001010000000001 \
          -C 3619200000 -r 106 --numerology 1 --ssb 516 \
          -E --sa --rfsim \
          --rfsimulator.options chanmod \
          --TAP 1 \
          -O ../../../ci-scripts/conf_files/nrue.uicc.conf \
          --rfsimulator.serveraddr 192.168.70.140 &&
        exec /bin/bash"
    stdin_open: true
    tty: true
    depends_on:
      - tt-gnb
    networks:
      public_net:
        ipv4_address: 192.168.70.150
    devices:
      - /dev/net/tun:/dev/net/tun

  # ── UE 2 ────────────────────────────────────────────────────────────────────
  tt-nrue2:
    image: tt-nrue:v2
    container_name: tt-ue2
    privileged: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ../Tiny_Twin:/opt/tt-ran/tt:rw
    entrypoint: >
      /bin/bash -c "
        cd /opt/tt-ran/tt/cmake_targets/ran_build/build/ &&
        ./nr-uesoftmodem \
          --uicc0.imsi 001010000000002 \
          -C 3619200000 -r 106 --numerology 1 --ssb 516 \
          -E --sa --rfsim \
          --rfsimulator.options chanmod \
          --TAP 1 \
          -O ../../../ci-scripts/conf_files/nrue.uicc.conf \
          --rfsimulator.serveraddr 192.168.70.140 &&
        exec /bin/bash"
    stdin_open: true
    tty: true
    depends_on:
      - tt-gnb
    networks:
      public_net:
        ipv4_address: 192.168.70.151
    devices:
      - /dev/net/tun:/dev/net/tun

  # ── UE 3 ────────────────────────────────────────────────────────────────────
  tt-nrue3:
    image: tt-nrue:v2
    container_name: tt-ue3
    privileged: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ../Tiny_Twin:/opt/tt-ran/tt:rw
    entrypoint: >
      /bin/bash -c "
        cd /opt/tt-ran/tt/cmake_targets/ran_build/build/ &&
        ./nr-uesoftmodem \
          --uicc0.imsi 001010000000003 \
          -C 3619200000 -r 106 --numerology 1 --ssb 516 \
          -E --sa --rfsim \
          --rfsimulator.options chanmod \
          --TAP 1 \
          -O ../../../ci-scripts/conf_files/nrue.uicc.conf \
          --rfsimulator.serveraddr 192.168.70.140 &&
        exec /bin/bash"
    stdin_open: true
    tty: true
    depends_on:
      - tt-gnb
    networks:
      public_net:
        ipv4_address: 192.168.70.152
    devices:
      - /dev/net/tun:/dev/net/tun

networks:
  public_net:
    external: true
    name: tt-public-net
