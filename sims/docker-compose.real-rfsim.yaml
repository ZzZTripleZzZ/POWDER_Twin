# dt_sync REAL-side rfsim stack (deployed on cn d430).
#
# Runs:
#   real-gnb    nr-softmodem in --rfsim mode (TCP server :4043)
#   real-ue1-3  nr-uesoftmodem in --rfsim mode connecting to real-gnb
#
# Channel model: "clean" baseline by default. The dt_sync experiment driver
# can swap TT_CHANNEL_FILE_* env vars to inject drift or apply named-pipe
# real-time CIR streaming from state_sync.py.
#
# EdgeRIC ZMQ ports (host-mode binds, accessible from twin d430 via ctrl-lan):
#   PUB metrics  5555 (gNB → state_sync)
#   SUB weights  5556 (state_sync → gNB)
#
# Prereq: docker network tt-public-net exists, tt-gnb-rfsim:v2 image built.
#
# Usage on cn d430:
#   cd ~/Tiny_Twin/sims/oai-cn && sudo docker compose up -d
#   cd ~/Tiny_Twin/sims && sudo docker compose -f docker-compose.real-rfsim.yaml up -d real-gnb
#   sleep 5
#   sudo docker compose -f docker-compose.real-rfsim.yaml up -d real-ue1 real-ue2 real-ue3

services:
  real-gnb:
    image: tt-gnb-rfsim:v2
    container_name: real-gnb
    privileged: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TT_CHANNEL_FILE_REAL=${TT_CHANNEL_FILE_REAL:-/tt-ran/channel/channel_clean.txt}
      - TT_CHANNEL_FILE_IMAG=${TT_CHANNEL_FILE_IMAG:-/tt-ran/channel/channel_clean.txt}
    volumes:
      - ../logs:/tt-ran/logs
      - /tmp:/tmp:rw
    entrypoint:
      - /bin/bash
      - -c
      - >-
        mkdir -p /tt-ran/logs &&
        cd /tt-ran/cmake_targets/ran_build/build/ &&
        exec ./nr-softmodem
        -O ../../../targets/PROJECTS/GENERIC-NR-5GC/CONF/gnb.sa.band78.fr1.106PRB.usrpb210.conf
        --rfsim -E --sa
        --rfsimulator.options chanmod
        --TAP 1 --TTI 1 --SNR 1 --CQI 1 --TPT 1
    networks:
      public_net:
        ipv4_address: 192.168.70.140
    ports:
      - "5555:5555"    # EdgeRIC ZMQ PUB (metrics out to state_sync)
      - "5556:5556"    # EdgeRIC ZMQ SUB (weights in from state_sync)
      - "4043:4043"    # rfsim TCP server (UEs connect)
    stdin_open: true
    tty: true

  real-ue1:
    image: tt-gnb-rfsim:v2
    container_name: real-ue1
    privileged: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    entrypoint:
      - /bin/bash
      - -c
      - >-
        cd /tt-ran/cmake_targets/ran_build/build/ &&
        exec ./nr-uesoftmodem
        --uicc0.imsi 001010000000001
        -C 3619200000 -r 106 --numerology 1 --ssb 516
        -E --sa --rfsim
        --rfsimulator.options chanmod
        --TAP 1
        -O ../../../ci-scripts/conf_files/nrue.uicc.conf
        --rfsimulator.serveraddr 192.168.70.140
    networks:
      public_net:
        ipv4_address: 192.168.70.150
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      - real-gnb

  real-ue2:
    image: tt-gnb-rfsim:v2
    container_name: real-ue2
    privileged: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    entrypoint:
      - /bin/bash
      - -c
      - >-
        cd /tt-ran/cmake_targets/ran_build/build/ &&
        exec ./nr-uesoftmodem
        --uicc0.imsi 001010000000002
        -C 3619200000 -r 106 --numerology 1 --ssb 516
        -E --sa --rfsim
        --rfsimulator.options chanmod
        --TAP 1
        -O ../../../ci-scripts/conf_files/nrue.uicc.conf
        --rfsimulator.serveraddr 192.168.70.140
    networks:
      public_net:
        ipv4_address: 192.168.70.151
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      - real-gnb

  real-ue3:
    image: tt-gnb-rfsim:v2
    container_name: real-ue3
    privileged: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    entrypoint:
      - /bin/bash
      - -c
      - >-
        cd /tt-ran/cmake_targets/ran_build/build/ &&
        exec ./nr-uesoftmodem
        --uicc0.imsi 001010000000003
        -C 3619200000 -r 106 --numerology 1 --ssb 516
        -E --sa --rfsim
        --rfsimulator.options chanmod
        --TAP 1
        -O ../../../ci-scripts/conf_files/nrue.uicc.conf
        --rfsimulator.serveraddr 192.168.70.140
    networks:
      public_net:
        ipv4_address: 192.168.70.152
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      - real-gnb

networks:
  public_net:
    external: true
    name: tt-public-net
