# docker-compose.5gcn.yaml
#
# Cross-node CN: same OAI 5G CN services as docker-compose.yaml, but the
# AMF runs on network_mode: host so its NGAP SCTP listens on the host's
# ctrl-lan interface (192.168.1.3 on the cn d430), reachable from
# gnb-real on cnode-guesthouse over ctrl-lan.
#
# Used by:
#   - profile_max_alloc.py / profile_outdoor_b210_mobile.py (outdoor OTA)
#   - register_and_instantiate_outdoor_mobile.py runbook
#
# Why: docker bridge networks are local to the docker host. The default
# CN compose assigns AMF 192.168.70.132 on the `public_net` bridge, which
# is unreachable from any other physical node. Putting AMF on host
# network lets gNB on a remote node connect via 192.168.1.3:38412.

services:

  mysql:
    container_name: "mysql"
    image: mysql:8.0
    volumes:
      - ./database/oai_db.sql:/docker-entrypoint-initdb.d/oai_db.sql
      - ./healthscripts/mysql-healthcheck.sh:/tmp/mysql-healthcheck.sh
    environment:
      - TZ=Europe/Paris
      - MYSQL_DATABASE=oai_db
      - MYSQL_USER=test
      - MYSQL_PASSWORD=test
      - MYSQL_ROOT_PASSWORD=linux
    healthcheck:
      test: /bin/bash -c "/tmp/mysql-healthcheck.sh"
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      public_net:
        ipv4_address: 192.168.70.131

  oai-nrf:
    container_name: "oai-nrf"
    image: oaisoftwarealliance/oai-nrf:develop
    expose:
      - 80/tcp
      - 8080/tcp
    volumes:
      - ./conf/config.yaml:/openair-nrf/etc/config.yaml
    environment:
      - TZ=Europe/Paris
    networks:
      public_net:
        ipv4_address: 192.168.70.130

  oai-ausf:
    container_name: "oai-ausf"
    image: oaisoftwarealliance/oai-ausf:develop
    expose:
      - 80/tcp
      - 8080/tcp
    volumes:
      - ./conf/config.yaml:/openair-ausf/etc/config.yaml
    environment:
      - TZ=Europe/Paris
    depends_on:
      - oai-nrf
    networks:
      public_net:
        ipv4_address: 192.168.70.138

  oai-udm:
    container_name: "oai-udm"
    image: oaisoftwarealliance/oai-udm:develop
    expose:
      - 80/tcp
      - 8080/tcp
    volumes:
      - ./conf/config.yaml:/openair-udm/etc/config.yaml
    environment:
      - TZ=Europe/Paris
    depends_on:
      - oai-nrf
    networks:
      public_net:
        ipv4_address: 192.168.70.137

  oai-udr:
    container_name: "oai-udr"
    image: oaisoftwarealliance/oai-udr:develop
    expose:
      - 80/tcp
      - 8080/tcp
    volumes:
      - ./conf/config.yaml:/openair-udr/etc/config.yaml
    environment:
      - TZ=Europe/Paris
    depends_on:
      mysql:
        condition: service_healthy
      oai-nrf:
        condition: service_started
    networks:
      public_net:
        ipv4_address: 192.168.70.136

  # AMF: host network so NGAP SCTP binds on the cn d430's ctrl-lan IP
  # (192.168.1.3). gNB on cnode-guesthouse can then reach 192.168.1.3:38412.
  oai-amf:
    container_name: "oai-amf"
    image: oaisoftwarealliance/oai-amf:develop
    network_mode: host
    volumes:
      - ./conf/config.yaml:/openair-amf/etc/config.yaml
    environment:
      - TZ=Europe/Paris
    depends_on:
      - mysql
      - oai-nrf
      - oai-ausf

  oai-smf:
    container_name: "oai-smf"
    image: oaisoftwarealliance/oai-smf:develop
    expose:
      - 80/tcp
      - 8080/tcp
      - 8805/udp
    volumes:
      - ./conf/config.yaml:/openair-smf/etc/config.yaml
    environment:
      - TZ=Europe/Paris
    depends_on:
      - oai-nrf
    networks:
      public_net:
        ipv4_address: 192.168.70.133

  oai-upf:
    container_name: "oai-upf"
    image: oaisoftwarealliance/oai-upf:develop
    expose:
      - 2152/udp
      - 8805/udp
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    cap_drop:
      - ALL
    privileged: true
    volumes:
      - ./conf/config.yaml:/openair-upf/etc/config.yaml
    environment:
      - TZ=Europe/Paris
    depends_on:
      - oai-nrf
      - oai-smf
    networks:
      public_net:
        ipv4_address: 192.168.70.139

  oai-ext-dn:
    privileged: true
    container_name: oai-ext-dn
    image: oaisoftwarealliance/trf-gen-cn5g:focal
    entrypoint: /bin/bash -c \
      "iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE; sleep infinity"
    depends_on:
      - oai-upf
    networks:
      public_net:
        ipv4_address: 192.168.70.135

networks:
  public_net:
    driver: bridge
    name: demo-oai-public-net
    ipam:
      config:
        - subnet: 192.168.70.128/26
    driver_opts:
      com.docker.network.bridge.name: "demo-oai"
