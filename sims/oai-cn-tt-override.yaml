# Drop-in override: makes oai-cn join the pre-existing tt-public-net
# instead of creating its own oai-cn5g-public-net.
#
# Usage:
#   cd ~/Tiny_Twin/sims/oai-cn
#   docker compose -f docker-compose.yaml \
#                  -f ~/dt_sync/sims/oai-cn-tt-override.yaml up -d
networks:
  public_net:
    external: true
    name: tt-public-net
